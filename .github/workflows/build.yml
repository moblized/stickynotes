name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk StickyNotes.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StickyNotes-${{ github.run_number }}
          path: StickyNotes.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sticky Notes 1.0.${{ github.run_number }}
          body: Install StickyNotes.apk on your phone. It updates the app in place and keeps your notes.
          files: StickyNotes.apk
          make_latest: true
